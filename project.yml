name: KobunApp

options:
  bundleIdPrefix: com.eitango.kobun
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  KobunApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: KobunApp
        excludes:
          - "App/Info.plist"

    # `info:` は「指定パスにInfo.plistを生成する」指定であり、手書きのInfo.plistを
    # xcodegen generate のたびに上書きしてしまう。参考元（eitango_app_01）では実際に
    # CFBundleDisplayName / ITSAppUsesNonExemptEncryption / UIBackgroundModes が
    # 全てビルドから抜け落ち、聞き流しのバックグラウンド再生が動かない状態になっていた。
    # 既存のファイルをそのまま使わせるため INFOPLIST_FILE を直接指定する。
    settings:
      base:
        INFOPLIST_FILE: KobunApp/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.kobun
        # 日本語＋スペースの PRODUCT_NAME はバンドル名・モジュール名・ビルドパスに波及し、
        # テストターゲットの TEST_HOST 解決に失敗する。ホーム画面に出る名前は
        # Info.plist の CFBundleDisplayName が担うため、ここはASCIIで固定する。
        PRODUCT_NAME: KobunApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        # TestFlightへ上げるたびにワークフローの実行番号で上書きする（同じ番号は再アップロードできない）
        CURRENT_PROJECT_VERSION: "1"
        # 証明書とProvisioning ProfileはApp Store Connect APIキー経由でXcodeに作らせる。
        # 手元にMacが無く、証明書を手動で書き出して秘密として持ち回ることができないため。
        DEVELOPMENT_TEAM: 5PT8D8SKN8
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES

  KobunAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KobunAppTests
    dependencies:
      - target: KobunApp
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KobunApp.app/KobunApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

  KobunAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KobunAppUITests
    dependencies:
      - target: KobunApp
    settings:
      base:
        TEST_TARGET_NAME: KobunApp
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KobunApp:
    build:
      targets:
        KobunApp: all
        KobunAppTests: [test]
        KobunAppUITests: [test]
    test:
      config: Debug
      targets:
        - KobunAppTests
        - KobunAppUITests
    run:
      config: Debug
    archive:
      config: Release
